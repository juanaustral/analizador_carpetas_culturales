name: Keep Render Alive

on:
  schedule:
    # Cada 10 minutos entre las 8am y las 2am (UTC-3 = Argentina)
    - cron: '*/10 6-23 * * *'
  workflow_dispatch: # Permitir ejecución manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://analizador-carpetas-culturales.onrender.com/" \
            --max-time 30
